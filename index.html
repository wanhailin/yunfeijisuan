<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>货运成本计算器</title>
<style>
:root{
    --bg:#050b18;
    --card:#0f172a;
    --card-border:rgba(255,255,255,0.08);
    --text:#e2e8f0;
    --text-sub:#94a3b8;
    --input:#1e293b;
    --input-border:rgba(255,255,0.08);
    --input-focus:#38bdf8;
    --primary:#3b82f6;
    --primary-light:#7dd3fc;
    --success:#42e994;
    --success-bg:rgba(66,233,148,0.08);
    --success-border:rgba(66,233,148,0.2);
    --danger:#ff7b7b;
    --danger-bg:rgba(255,123,123,0.08);
    --danger-border:rgba(255,123,123,0.2);
    --divider:rgba(255,255,255,0.08);
}
body.light{
    --bg:#f1f5f9;
    --card:#ffffff;
    --card-border:rgba(0,0,0,0.08);
    --text:#0f172a;
    --text-sub:#475569;
    --input:#f8fafc;
    --input-border:rgba(0,0,0,0.1);
    --input-focus:#2563eb;
    --primary:#2563eb;
    --primary-light:#0369a1;
    --success:#059669;
    --success-bg:#ecfdf5;
    --success-border:#a7f3d0;
    --danger:#dc2626;
    --danger-bg:#fef2f2;
    --danger-border:#fecaca;
    --divider:rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;}
html,body{
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
}
body{padding:12px;padding-bottom:90px;color:var(--text);background:var(--bg);min-height:100vh;}
.num-font{font-family:"SF Mono",Consolas,monospace;}
.page{display:none;max-width:780px;margin:0 auto;}
.page.active{display:block;}
.header{position:relative;padding:14px;margin-bottom:12px;border-radius:16px;background:var(--card);border:1px solid var(--card-border);}
.header h1{font-size:19px;font-weight:900;text-align:center;}
.header p{text-align:center;font-size:11px;color:var(--text-sub);margin-top:4px;}
.header .left-btns,.header .right-btns{position:absolute;top:50%;transform:translateY(-50%);display:flex;gap:8px;}
.header .left-btns{left:12px;}
.header .right-btns{right:12px;}
.icon-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid var(--card-border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}
body.light .icon-btn{background:rgba(0,0,0,0.04);}
.reset-btn{height:34px;padding:0 10px;font-size:12px;color:var(--danger);border:1px solid var(--danger-border);background:var(--danger-bg);border-radius:10px;cursor:pointer;}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px;margin-bottom:12px;}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.card-title{font-size:14px;font-weight:700;color:var(--text-sub);display:flex;align-items:center;gap:8px;}
.card-title::before{content:"";width:3px;height:16px;border-radius:2px;background:var(--primary);}
.btn-small{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--danger-border);background:var(--danger-bg);color:var(--danger);font-weight:600;cursor:pointer;}
.btn-voice{background:rgba(66,233,148,0.1);color:#42e994;border-color:rgba(66,233,148,0.2);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-item{margin-bottom:10px;}
.form-item.full{grid-column:span 2;}
.form-item label{font-size:12px;color:var(--text-sub);margin-bottom:6px;display:block;}
.input-group{display:flex;align-items:center;gap:6px;}
.input-group .adj-btn{width:36px;height:46px;flex-shrink:0;border-radius:10px;border:1px solid var(--input-border);background:var(--input);color:var(--text);font-size:18px;font-weight:700;cursor:pointer;}
.form-item input,.form-item select{width:100%;height:46px;padding:0 12px;border:1px solid var(--input-border);border-radius:10px;font-size:15px;color:var(--text);background:var(--input);outline:none;}
.form-item input:focus,.form-item select:focus{border-color:var(--input-focus);}
.input-group input{text-align:center;}
.empty-card{border-color:var(--danger-border);background:var(--danger-bg);}
.empty-card .card-head{margin-bottom:0;cursor:pointer;}
.empty-card .card-body{display:none;padding-top:12px;margin-top:12px;border-top:1px dashed var(--divider);}
.empty-card.open .card-body{display:block;}
.empty-mile{font-size:12px;color:var(--text-sub);}
.btn-toggle-pin{width:100%;background:var(--primary);color:#fff;border:none;height:50px;font-size:16px;margin-bottom:12px;border-radius:14px;cursor:pointer;font-weight:600;}
.pin-box{display:none;margin-top:6px;}
.pin-box.show{display:block;}
.pin-item{background:var(--input);border:1px solid var(--card-border);border-radius:12px;padding:12px;margin-bottom:10px;}
.pin-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.pin-head .name{font-size:14px;font-weight:700;}
.pin-head .icon{font-size:18px;color:var(--primary-light);font-weight:bold;}
.pin-clear{font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--danger-border);background:var(--danger-bg);color:var(--danger);cursor:pointer;}
.pin-body{display:none;padding-top:10px;margin-top:10px;border-top:1px dashed var(--divider);}
.pin-body.show{display:block;}
/* ========== 结果汇总：完全对齐截图样式 ========== */
.result{display:none;border-radius:18px;padding:16px;margin-top:12px;background:#162238;border:1px solid rgba(255,255,255,0.1);}
.result.show{display:block;}
body.light .result{background:#f8fafc;border-color:rgba(0,0,0,0.1);}
.profit-top-card{text-align:center;padding:16px 10px;border-radius:14px;background:#1c3448;margin-bottom:16px;}
body.light .profit-top-card{background:#ecfdf5;}
.profit-top-card .label{font-size:13px;color:#b0c4de;margin-bottom:8px;}
body.light .profit-top-card .label{color:#065f46;}
.profit-top-card .profit-big-num{font-size:42px;font-weight:900;color:#42e994;}
body.light .profit-top-card .profit-big-num{color:#059669;}
.result-row-wrap{display:grid;grid-template-columns:120px 1fr;gap:14px;margin-bottom:16px;align-items:center;}
.gauge-wrap{text-align:center;}
.gauge-circle{position:relative;width:110px;height:110px;margin:0 auto;}
.gauge-circle svg{transform:rotate(-90deg);width:110px;height:110px;}
.gauge-text{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;}
.gauge-text .v{font-size:22px;font-weight:900;color:#7dd3fc;}
body.light .gauge-text .v{color:#0284c7;}
.gauge-text .t{font-size:11px;color:#b0c4de;margin-top:2px;}
body.light .gauge-text .t{color:#64748b;}
.gauge-name{font-size:12px;color:#b0c4de;margin-top:6px;}
body.light .gauge-name{color:#64748b;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.info-grid-item{background:#1e2f48;padding:12px 8px;border-radius:10px;text-align:center;}
body.light .info-grid-item{background:#f1f5f9;}
.info-grid-item .lab{font-size:11px;color:#b0c4de;margin-bottom:4px;}
body.light .info-grid-item .lab{color:#64748b;}
.info-grid-item .val{font-size:17px;font-weight:bold;}
.c-green{color:#42e994;}
.c-red{color:#ff7b7b;}
.c-blue{color:#7dd3fc;}
body.light .c-green{color:#059669;}
body.light .c-red{color:#dc2626;}
body.light .c-blue{color:#0284c7;}
.list-block{background:#142036;border-radius:12px;padding:14px;margin-bottom:14px;}
body.light .list-block{background:#f8fafc;}
.list-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px solid #273854;}
body.light .list-row{border-bottom-color:#e2e8f0;}
.list-row:last-child{border-bottom:none;}
.list-lab{color:#b0c4de;}
body.light .list-lab{color:#64748b;}
.val-in{color:#42e994;font-weight:bold;}
.val-out{color:#ff7b7b;font-weight:bold;}
body.light .val-in{color:#059669;}
body.light .val-out{color:#dc2626;}
.tip-box{text-align:center;padding:10px;border-radius:10px;font-size:14px;font-weight:bold;margin-bottom:16px;}
.tip-good{background:rgba(66,233,148,0.12);color:#42e994;border:1px solid rgba(66,233,148,0.25);}
.tip-warn{background:rgba(251,191,36,0.12);color:#fbbf24;border:1px solid rgba(251,191,36,0.25);}
.tip-bad{background:rgba(255,123,123,0.12);color:#ff7b7b;border:1px solid rgba(255,123,123,0.25);}
body.light .tip-good{background:#ecfdf5;color:#059669;border-color:#a7f3d0;}
body.light .tip-warn{background:#fefce8;color:#d97706;border-color:#fde047;}
body.light .tip-bad{background:#fef2f2;color:#dc2626;border-color:#fecaca;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}
.btn-row button{flex:1;min-width:110px;height:44px;border-radius:12px;font-size:14px;border:none;font-weight:600;cursor:pointer;}
.btn-detail{background:#233452;color:#cbd5e1;}
body.light .btn-detail{background:#e2e8f0;color:#334155;}
.btn-image{background:#2563eb;color:#fff;}
.detail-box{overflow:hidden;max-height:0;transition:max-height 0.4s ease;margin-top:12px;}
.detail-box.open{max-height:6000px;}
.detail-inner{background:var(--input);border:1px solid var(--card-border);border-radius:14px;padding:14px;}
.detail-block{padding-bottom:12px;margin-bottom:12px;border-bottom:1px dashed var(--divider);}
.detail-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.detail-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;}
.detail-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-sub);padding:5px 0;}
.text-in{color:var(--success);font-weight:700;}
.text-out{color:var(--danger);font-weight:700;}
.compare{display:none;background:var(--success-bg);border:1px solid var(--success-border);border-radius:12px;padding:14px;margin-bottom:14px;}
.compare.warn{background:#fffbeb;border-color:#fcd34d;}
.compare-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.compare-tag{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(66,233,148,0.15);color:var(--success);border:1px solid var(--success-border);}
.compare.warn .compare-tag{background:rgba(251,191,36,0.15);color:#d97706;border-color:#fcd34d;}
.compare-body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;}
.compare-item{background:rgba(255,255,255,0.04);border-radius:8px;padding:10px 6px;}
body.light .compare-item{background:rgba(255,255,255,0.6);}
.compare-item .n{font-size:16px;font-weight:800;color:var(--text);margin-bottom:4px;}
.compare-item .n.add{color:var(--success);font-size:18px;}
.compare.warn .compare-item .n.add{color:#d97706;}
.compare-item .d{font-size:10px;color:var(--text-sub);}
.history-empty{text-align:center;color:var(--text-sub);padding:40px 16px;font-size:14px;}
.his-item{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px;margin-bottom:12px;}
.his-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.his-time{font-size:12px;color:var(--text-sub);}
.his-btns{display:flex;gap:6px;flex-wrap:wrap;}
.his-btn{font-size:11px;padding:4px 10px;border-radius:999px;border:none;cursor:pointer;font-weight:600;}
.his-btn.del{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);}
.his-btn.view{background:rgba(56,189,248,0.08);color:var(--primary-light);border:1px solid rgba(56,189,248,0.18);}
.his-btn.use{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);}
.his-sum .big{font-size:22px;font-weight:900;margin-bottom:8px;}
.his-sum .big.ok{color:var(--success);}
.his-sum .big.no{color:var(--danger);}
.his-sum p{font-size:13px;color:var(--text-sub);margin:5px 0;}
.his-detail{overflow:hidden;max-height:0;transition:max-height 0.4s ease;margin-top:0;}
.his-detail.open{max-height:5000px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--divider);}
.image-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0.85);z-index:999;align-items:center;justify-content:center;padding:20px;}
.image-modal.show{display:flex;}
.image-modal .box{background:var(--card);border-radius:16px;padding:16px;max-width:90vw;max-height:90vh;overflow:auto;}
.image-modal .box h3{font-size:16px;margin-bottom:12px;text-align:center;}
.image-modal img{max-width:100%;border-radius:12px;display:block;margin-bottom:12px;}
.image-modal .close-btn{width:100%;height:44px;border-radius:12px;background:var(--primary);color:#fff;border:none;font-size:15px;cursor:pointer;}
.fixed-calc-btn{position:fixed;left:12px;right:12px;bottom:12px;height:52px;border:none;border-radius:14px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;background:var(--primary);box-shadow:0 4px 20px rgba(59,130,246,0.35);z-index:99;}
@media (max-width:640px){
    .result-row-wrap{grid-template-columns:1fr;justify-items:center;}
    .info-grid{width:100%;}
    .profit-top-card .profit-big-num{font-size:36px;}
    .btn-row button{flex:1 1 45%;}
}
</style>
</head>
<body>
<div class="page active" id="pageCalc">
    <div class="header">
        <div class="left-btns">
            <button class="icon-btn" id="btnGoHis">←</button>
        </div>
        <div class="right-btns">
            <button class="icon-btn" id="btnTheme">☀</button>
            <button class="reset-btn" id="btnResetAll">清除</button>
        </div>
        <h1>货运成本计算器</h1>
        <p>油费+高速费+信息费 成本测算</p>
    </div>
    <div class="card">
        <div class="card-head">
            <div class="card-title">主单信息</div>
            <div style="display:flex;gap:8px;">
                <button class="btn-small btn-voice" id="btnVoiceInput">🎤语音</button>
                <button class="btn-small" id="btnClearMain">清空</button>
            </div>
        </div>
        <div class="form-grid">
            <div class="form-item">
                <label>载货油耗 L/100km</label>
                <select id="oilUse">
                    <option value="17">空/轻载 17</option>
                    <option value="21" selected>标载 21</option>
                    <option value="23">重载 23</option>
                </select>
            </div>
            <div class="form-item">
                <label>柴油单价 元/升</label>
                <div class="input-group">
                    <button class="adj-btn" data-adj="oilPrice" data-step="-0.1">−</button>
                    <input type="number" step="0.1" min="0" id="oilPrice" value="7.8">
                    <button class="adj-btn" data-adj="oilPrice" data-step="0.1">+</button>
                </div>
            </div>
            <div class="form-item">
                <label>主单里程 km</label>
                <input type="number" min="0" id="mainKm">
            </div>
            <div class="form-item">
                <label>高速单价 元/km</label>
                <div class="input-group">
                    <button class="adj-btn" data-adj="roadPrice" data-step="-0.1">−</button>
                    <input type="number" step="0.1" min="0" id="roadPrice" value="1.1">
                    <button class="adj-btn" data-adj="roadPrice" data-step="0.1">+</button>
                </div>
            </div>
            <div class="form-item">
                <label>主单运费 元</label>
                <input type="number" min="0" id="mainMoney">
            </div>
            <div class="form-item">
                <label>信息费 元</label>
                <input type="number" min="0" id="infoFee">
            </div>
        </div>
    </div>
    <div class="card empty-card" id="emptyCard">
        <div class="card-head" id="emptyToggle">
            <div class="card-title">放空里程成本</div>
            <div class="empty-mile" id="emptyMileText">0 km</div>
        </div>
        <div class="card-body">
            <div class="form-grid">
                <div class="form-item">
                    <label>放空总 km</label>
                    <input type="number" min="0" id="emptyKm">
                </div>
                <div class="form-item">
                    <label>放空高速 km</label>
                    <input type="number" min="0" id="emptyHigh">
                </div>
            </div>
        </div>
    </div>
    <button class="btn-toggle-pin" id="btnTogglePin">展开多拼单录入</button>
    <div class="pin-box" id="pinBox">
        <div class="card">
            <div class="card-head">
                <div class="card-title">拼单货源</div>
                <button class="btn-small" id="btnClearPin">清空全部</button>
            </div>
            
            <div class="pin-item">
                <div class="pin-head" data-pin="1">
                    <span class="name">拼单一</span>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <button class="pin-clear" data-clear="1">清空</button>
                        <span class="icon">+</span>
                    </div>
                </div>
                <div class="pin-body" data-body="1">
                    <div class="form-grid">
                        <div class="form-item"><label>里程</label><input type="number" min="0" id="p1km"></div>
                        <div class="form-item"><label>高速里程</label><input type="number" min="0" id="p1high"></div>
                        <div class="form-item full"><label>运费</label><input type="number" min="0" id="p1money"></div>
                    </div>
                </div>
            </div>
            <div class="pin-item">
                <div class="pin-head" data-pin="2">
                    <span class="name">拼单二</span>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <button class="pin-clear" data-clear="2">清空</button>
                        <span class="icon">+</span>
                    </div>
                </div>
                <div class="pin-body" data-body="2">
                    <div class="form-grid">
                        <div class="form-item"><label>里程</label><input type="number" min="0" id="p2km"></div>
                        <div class="form-item"><label>高速里程</label><input type="number" min="0" id="p2high"></div>
                        <div class="form-item full"><label>运费</label><input type="number" min="0" id="p2money"></div>
                    </div>
                </div>
            </div>
            <div class="pin-item">
                <div class="pin-head" data-pin="3">
                    <span class="name">拼单三</span>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <button class="pin-clear" data-clear="3">清空</button>
                        <span class="icon">+</span>
                    </div>
                </div>
                <div class="pin-body" data-body="3">
                    <div class="form-grid">
                        <div class="form-item"><label>里程</label><input type="number" min="0" id="p3km"></div>
                        <div class="form-item"><label>高速里程</label><input type="number" min="0" id="p3high"></div>
                        <div class="form-item full"><label>运费</label><input type="number" min="0" id="p3money"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 结果汇总面板 -->
    <div class="result" id="resultBox">
        <div class="profit-top-card">
            <div class="label">单趟净赚（已扣信息费）</div>
            <div class="profit-big-num num-font" id="totalProfit">0.00 元</div>
        </div>
        <div class="result-row-wrap">
            <div class="gauge-wrap">
                <div class="gauge-circle">
                    <svg viewBox="0 0 110 110">
                        <circle cx="55" cy="55" r="48" fill="none" stroke="#273854" stroke-width="8" />
                        <circle id="gaugeBar" cx="55" cy="55" r="48" fill="none" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round" stroke-dasharray="301.59" stroke-dashoffset="301.59" />
                    </svg>
                    <div class="gauge-text">
                        <div class="v num-font" id="rateNum">0%</div>
                        <div class="t">收益率</div>
                    </div>
                </div>
                <div class="gauge-name">盈利水平</div>
            </div>
            <div class="info-grid">
                <div class="info-grid-item">
                    <div class="lab">每公里净赚</div>
                    <div class="val c-green num-font" id="perKm">0.00 元</div>
                </div>
                <div class="info-grid-item">
                    <div class="lab">主单单位成本</div>
                    <div class="val c-red num-font" id="mainCost">0.00 元</div>
                </div>
                <div class="info-grid-item">
                    <div class="lab">放空总费用</div>
                    <div class="val c-red num-font" id="emptyCost">0.00 元</div>
                </div>
                <div class="info-grid-item">
                    <div class="lab">全程总里程</div>
                    <div class="val c-blue num-font" id="allKm">0 km</div>
                </div>
            </div>
        </div>
        <div class="compare" id="compareBox">
            <div class="compare-head">
                <div style="display:flex;align-items:center;gap:8px;"><span>↗</span><span>拼单增收对比</span></div>
                <div class="compare-tag" id="compareTag">值得拼</div>
            </div>
            <div class="compare-body">
                <div class="compare-item"><div class="n num-font" id="noPinMoney">0.00</div><div class="d">不拼单净赚</div></div>
                <div class="compare-item"><div class="n add num-font" id="addMoney">+0.00</div><div class="d">拼单多赚</div></div>
                <div class="compare-item"><div class="n num-font" id="withPinMoney">0.00</div><div class="d">合计净赚</div></div>
            </div>
        </div>
        <div class="list-block">
            <div class="list-row"><span class="list-lab">全部运费收入</span><span class="val-in" id="sumIn">0.00 元</span></div>
            <div class="list-row"><span class="list-lab">燃油总支出</span><span class="val-out" id="sumOil">0.00 元</span></div>
            <div class="list-row"><span class="list-lab">高速总支出</span><span class="val-out" id="sumRoad">0.00 元</span></div>
            <div class="list-row"><span class="list-lab">信息费支出</span><span class="val-out" id="sumInfo">0.00 元</span></div>
            <div class="list-row"><span class="list-lab">可变总成本</span><span class="val-out" id="sumAll">0.00 元</span></div>
        </div>
        <div class="tip-box" id="tipText">自动评估货源好坏</div>
        <div class="btn-row">
            <button class="btn-detail" id="btnDetail">展开明细</button>
            <button class="btn-image" id="btnImage">生成图片</button>
        </div>
        <div class="detail-box" id="detailBox"><div class="detail-inner" id="detailHtml"></div></div>
    </div>
</div>
<div class="page" id="pageHis">
    <div class="header">
        <div class="left-btns">
            <button class="icon-btn" id="btnGoCalc">←</button>
        </div>
        <h1>货运成本计算器</h1>
        <p>货源对比复盘</p>
    </div>
    <div id="hisList"></div>
</div>
<div class="image-modal" id="imageModal">
    <div class="box">
        <h3>长按图片保存到相册</h3>
        <img id="resultImg" alt="测算结果图片">
        <button class="close-btn" id="closeImage">关闭</button>
    </div>
</div>
<button class="fixed-calc-btn" id="btnCalc">一键计算利润</button>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const EMPTY_OIL_RATE = 16;
let recognition = null;
// 格式化金额
function formatMoney(n){
    if(isNaN(n)) return "0.00";
    return Number(n).toFixed(2);
}
// 获取输入值
function getNum(id){
    const v = parseFloat(document.getElementById(id).value);
    return isNaN(v) || v < 0 ? 0 : v;
}
const cacheKeys = ['oilUse','oilPrice','roadPrice','mainKm','mainMoney','infoFee','emptyKm','emptyHigh',
    'p1km','p1high','p1money','p2km','p2high','p2money','p3km','p3high','p3money','theme'];
// 本地存储工具
function safeSet(key, value){try{localStorage.setItem(key, value);}catch(e){}}
function safeGet(key){try{return localStorage.getItem(key);}catch(e){return null;}}
function safeRemove(key){try{localStorage.removeItem(key);}catch(e){}}
// 加载缓存
function loadCache(){
    try{
        const data = JSON.parse(safeGet("truck_calc_cache") || "{}");
        cacheKeys.forEach(key=>{
            if(key === 'theme'){
                if(data[key] === 'light') document.body.classList.add('light');
                return;
            }
            if(data[key] !== undefined && document.getElementById(key)){
                document.getElementById(key).value = data[key];
            }
        });
        updateEmptyMileText();
        updateThemeIcon();
    }catch(e){}
}
// 保存缓存
function saveCache(){
    try{
        const data = {};
        cacheKeys.forEach(key=>{
            if(key === 'theme'){
                data[key] = document.body.classList.contains('light') ? 'light' : 'dark';
                return;
            }
            if(document.getElementById(key)) data[key] = document.getElementById(key).value;
        });
        safeSet("truck_calc_cache", JSON.stringify(data));
    }catch(e){}
}
// 主题切换
function toggleTheme(){
    document.body.classList.toggle('light');
    updateThemeIcon();
    saveCache();
}
function updateThemeIcon(){
    document.getElementById("btnTheme").innerText = document.body.classList.contains('light') ? "☾" : "☀";
}
// 单价微调
function adjustValue(id, step){
    const input = document.getElementById(id);
    let val = parseFloat(input.value) || 0;
    val = Math.max(0, +(val + Number(step)).toFixed(2));
    input.value = val;
    saveCache();
}
// 更新放空里程显示
function updateEmptyMileText(){
    const km = getNum("emptyKm");
    document.getElementById("emptyMileText").innerText = km + " km";
}
// 页面切换
let showHistory = false;
function switchPage(){
    showHistory = !showHistory;
    document.getElementById("pageCalc").classList.toggle("active", !showHistory);
    document.getElementById("pageHis").classList.toggle("active", showHistory);
    if(showHistory) renderHistory();
}
// 历史记录
function getHistoryList(){
    try{return JSON.parse(safeGet("truck_calc_history") || "[]");}catch(e){return [];}
}
function addHistory(item){
    try{
        const list = getHistoryList();
        list.unshift(item);
        if(list.length > 8) list.length = 8;
        safeSet("truck_calc_history", JSON.stringify(list));
    }catch(e){}
}
function deleteHistory(index){
    const list = getHistoryList();
    list.splice(index, 1);
    safeSet("truck_calc_history", JSON.stringify(list));
    renderHistory();
}
function useHistory(index){
    const list = getHistoryList();
    const item = list[index];
    if(!item || !item.data) return;
    Object.keys(item.data).forEach(key=>{
        if(document.getElementById(key)) document.getElementById(key).value = item.data[key];
    });
    saveCache();
    updateEmptyMileText();
    switchPage();
    calculate();
}
function renderHistory(){
    const list = getHistoryList();
    const box = document.getElementById("hisList");
    if(list.length === 0){
        box.innerHTML = '<div class="history-empty">暂无测算记录<br>计算后自动保存</div>';
        return;
    }
    let html = "";
    list.forEach((item, i)=>{
        const isOk = Number(item.totalProfit) >= 0;
        html += `<div class="his-item">
            <div class="his-head">
                <div class="his-time">${item.time}</div>
                <div class="his-btns">
                    <button class="his-btn use" data-use="${i}">复用</button>
                    <button class="his-btn view" data-view="${i}">明细</button>
                    <button class="his-btn del" data-del="${i}">删除</button>
                </div>
            </div>
            <div class="his-sum">
                <div class="big ${isOk?'ok':'no'}">净赚 ${item.totalProfit} 元</div>
                <p>全程${item.allKm}km｜${item.type}</p>
                <p>每公里${item.perKm}元</p>
                <p>${item.tip}</p>
            </div>
            <div class="his-detail" data-detail="${i}"><div class="detail-inner">${item.detail}</div></div>
        </div>`;
    });
    box.innerHTML = html;
    box.querySelectorAll('.his-btn.del').forEach(btn=>{
        btn.onclick = ()=> deleteHistory(Number(btn.dataset.del));
    });
    box.querySelectorAll('.his-btn.use').forEach(btn=>{
        btn.onclick = ()=> useHistory(Number(btn.dataset.use));
    });
    box.querySelectorAll('.his-btn.view').forEach(btn=>{
        btn.onclick = ()=>{
            const idx = Number(btn.dataset.view);
            document.querySelector(`[data-detail="${idx}"]`).classList.toggle('open');
        }
    });
}
// 核心计算
let lastCalcData = {};
function calculate(){
    const oilUse = Number(document.getElementById("oilUse").value);
    const oilPrice = getNum("oilPrice");
    const roadPrice = getNum("roadPrice");
    const mainKm = getNum("mainKm");
    const mainMoney = getNum("mainMoney");
    const infoFee = getNum("infoFee");
    const emptyKm = getNum("emptyKm");
    const emptyHigh = getNum("emptyHigh");
    const mainOilCost = mainKm * oilUse / 100 * oilPrice;
    const mainRoadCost = mainKm * roadPrice;
    const mainAllCost = mainOilCost + mainRoadCost;
    const mainProfit = mainMoney - mainAllCost - infoFee;
    const mainPerCost = mainKm > 0 ? mainAllCost / mainKm : 0;
    const emptyOilCost = emptyKm * EMPTY_OIL_RATE / 100 * oilPrice;
    const emptyRoadCost = emptyHigh * roadPrice;
    const emptyAllCost = emptyOilCost + emptyRoadCost;
    let pinMoneySum = 0, pinKmSum = 0, pinHighSum = 0, pinCount = 0;
    ["p1","p2","p3"].forEach(p=>{
        const k = getNum(p+"km"), h = getNum(p+"high"), m = getNum(p+"money");
        if(k > 0 && m > 0){
            pinCount++;
            pinMoneySum += m;
            pinKmSum += k;
            pinHighSum += h;
        }
    });
    const pinOilCost = pinKmSum * oilUse / 100 * oilPrice;
    const pinRoadCost = pinHighSum * roadPrice;
    const allIncome = mainMoney + pinMoneySum;
    const allOilCost = mainOilCost + emptyOilCost + pinOilCost;
    const allRoadCost = mainRoadCost + emptyRoadCost + pinRoadCost;
    const allCost = allOilCost + allRoadCost + infoFee;
    const totalProfit = allIncome - allCost;
    const totalKm = mainKm + emptyKm + pinKmSum;
    const perKmProfit = totalKm > 0 ? totalProfit / totalKm : 0;
    const profitRate = allIncome > 0 ? totalProfit / allIncome : 0;
    const noPinProfit = mainProfit - emptyAllCost;
    lastCalcData = {totalProfit, totalKm, perKmProfit, allIncome, allOilCost, allRoadCost, allCost, profitRate};
    const resultBox = document.getElementById("resultBox");
    resultBox.classList.add("show");
    document.getElementById("totalProfit").innerText = formatMoney(totalProfit) + " 元";
    document.getElementById("perKm").innerText = formatMoney(perKmProfit) + " 元";
    document.getElementById("mainCost").innerText = formatMoney(mainPerCost) + " 元";
    document.getElementById("emptyCost").innerText = formatMoney(emptyAllCost) + " 元";
    document.getElementById("allKm").innerText = totalKm.toFixed(0) + " km";
    document.getElementById("sumIn").innerText = formatMoney(allIncome) + " 元";
    document.getElementById("sumOil").innerText = formatMoney(allOilCost) + " 元";
    document.getElementById("sumRoad").innerText = formatMoney(allRoadCost) + " 元";
    document.getElementById("sumInfo").innerText = formatMoney(infoFee) + " 元";
    document.getElementById("sumAll").innerText = formatMoney(allCost) + " 元";
    const fullLen = 301.59;
    const showRate = Math.max(0, Math.min(1, profitRate));
    document.getElementById("gaugeBar").style.strokeDashoffset = fullLen * (1 - showRate);
    document.getElementById("rateNum").innerText = (profitRate * 100).toFixed(1) + "%";
    let mileType, tipText;
    const tipEl = document.getElementById("tipText");
    tipEl.className = "tip-box";
    if(totalKm <= 50){
        mileType = "超短途倒短";
        if(totalProfit >= 350){ tipEl.classList.add("tip-good"); tipText = "优质倒短，覆盖当日人工"; }
        else if(totalProfit >= 260){ tipEl.classList.add("tip-warn"); tipText = "仅放空兜底，不专程跑"; }
        else{ tipEl.classList.add("tip-bad"); tipText = "低价单，不建议干"; }
    }else if(totalKm <= 300){
        mileType = "短途";
        if(perKmProfit >= 1.5){ tipEl.classList.add("tip-good"); tipText = "高价货源，优先接"; }
        else if(perKmProfit >= 1.0){ tipEl.classList.add("tip-warn"); tipText = "顺路带回程货才可接"; }
        else{ tipEl.classList.add("tip-bad"); tipText = "行业低价，专程跑亏人工"; }
    }else if(totalKm <= 800){
        mileType = "中长途";
        if(perKmProfit >= 1.2){ tipEl.classList.add("tip-good"); tipText = "干线好价，稳定盈利"; }
        else if(perKmProfit >= 0.7){ tipEl.classList.add("tip-warn"); tipText = "无放空可临时补档期"; }
        else{ tipEl.classList.add("tip-bad"); tipText = "运价偏低，长期不合算"; }
    }else{
        mileType = "长途干线";
        if(perKmProfit >= 1.0){ tipEl.classList.add("tip-good"); tipText = "长途优质单，摊薄固定成本"; }
        else if(perKmProfit >= 0.55){ tipEl.classList.add("tip-warn"); tipText = "必须匹配返程货再考虑"; }
        else{ tipEl.classList.add("tip-bad"); tipText = "亏本低价，慎接"; }
    }
    tipEl.innerText = tipText;
    lastCalcData.tipText = tipText;
    lastCalcData.mileType = mileType;
    // 拼单对比面板
    const compareBox = document.getElementById("compareBox");
    if(pinCount > 0){
        compareBox.style.display = "block";
        const addProfit = totalProfit - noPinProfit;
        document.getElementById("noPinMoney").innerText = formatMoney(noPinProfit);
        document.getElementById("addMoney").innerText = (addProfit >= 0 ? "+" : "") + formatMoney(addProfit);
        document.getElementById("withPinMoney").innerText = formatMoney(totalProfit);
        const tagEl = document.getElementById("compareTag");
        if(addProfit > 0){ compareBox.classList.remove("warn"); tagEl.innerText = "值得拼"; }
        else{ compareBox.classList.add("warn"); tagEl.innerText = "不划算"; }
    }else{
        compareBox.style.display = "none";
    }
    let detailHtml = `<div class="detail-block"><div class="detail-title">收入明细</div>
        <div class="detail-row"><span>主单运费</span><span class="text-in">${formatMoney(mainMoney)} 元</span></div>`;
    ["p1","p2","p3"].forEach((p, idx)=>{
        const k = getNum(p+"km"), m = getNum(p+"money");
        if(k > 0) detailHtml += `<div class="detail-row"><span>拼单${idx+1}运费</span><span class="text-in">${formatMoney(m)} 元</span></div>`;
    });
    detailHtml += `</div>
    <div class="detail-block"><div class="detail-title">主单成本</div>
        <div class="detail-row"><span>里程</span><span>${mainKm.toFixed(0)} km</span></div>
        <div class="detail-row"><span>燃油(${oilUse}L/100km)</span><span class="text-out">${formatMoney(mainOilCost)} 元</span></div>
        <div class="detail-row"><span>高速费</span><span class="text-out">${formatMoney(mainRoadCost)} 元</span></div>
        <div class="detail-row"><span>信息费</span><span class="text-out">${formatMoney(infoFee)} 元</span></div>
        <div class="detail-row"><span>主单总成本</span><span class="text-out">${formatMoney(mainAllCost + infoFee)} 元</span></div>
    </div>
    <div class="detail-block"><div class="detail-title">放空成本</div>
        <div class="detail-row"><span>放空里程</span><span>${emptyKm.toFixed(0)} km</span></div>
        <div class="detail-row"><span>放空油费</span><span class="text-out">${formatMoney(emptyOilCost)} 元</span></div>
        <div class="detail-row"><span>放空高速</span><span class="text-out">${formatMoney(emptyRoadCost)} 元</span></div>
    </div>`;
    
    if(pinCount > 0){
        detailHtml += `<div class="detail-block"><div class="detail-title">拼单成本</div>`;
        ["p1","p2","p3"].forEach((p, idx)=>{
            const k = getNum(p+"km"), h = getNum(p+"high"), m = getNum(p+"money");
            if(k > 0 && m > 0){
                const sOil = k * oilUse / 100 * oilPrice;
                const sRoad = h * roadPrice;
                detailHtml += `
                <div class="detail-row"><span>拼单${idx+1}里程</span><span>${k.toFixed(0)} km</span></div>
                <div class="detail-row"><span>拼单${idx+1}油费</span><span class="text-out">${formatMoney(sOil)} 元</span></div>
                <div class="detail-row"><span>拼单${idx+1}高速费</span><span class="text-out">${formatMoney(sRoad)} 元</span></div>`;
            }
        });
        detailHtml += `</div>`;
    }
    detailHtml += `
    <div class="detail-block"><div class="detail-title">全程汇总</div>
        <div class="detail-row"><span>全部油费</span><span class="text-out">${formatMoney(allOilCost)} 元</span></div>
        <div class="detail-row"><span>全部高速</span><span class="text-out">${formatMoney(allRoadCost)} 元</span></div>
        <div class="detail-row"><span>信息费合计</span><span class="text-out">${formatMoney(infoFee)} 元</span></div>
        <div class="detail-row"><span>合计可变成本</span><span class="text-out">${formatMoney(allCost)} 元</span></div>
    </div>`;
    document.getElementById("detailHtml").innerHTML = detailHtml;
    const saveData = {};
    cacheKeys.forEach(k=>{if(document.getElementById(k)) saveData[k] = document.getElementById(k).value;});
    addHistory({
        data: saveData,
        time: new Date().toLocaleString(),
        totalProfit: formatMoney(totalProfit),
        allKm: totalKm.toFixed(0),
        perKm: formatMoney(perKmProfit),
        type: mileType,
        tip: tipText,
        detail: detailHtml
    });
    resultBox.scrollIntoView({behavior: "smooth", block: "start"});
}
// 生成图片
function generateImage(){
    if(!lastCalcData || lastCalcData.totalProfit === undefined){
        alert("请先点击一键计算利润");
        return;
    }
    if(typeof html2canvas === 'undefined'){
        alert("图片组件加载失败，请检查网络后重试");
        return;
    }
    const bgColor = document.body.classList.contains('light') ? '#f8fafc' : '#162238';
    html2canvas(document.getElementById("resultBox"), {
        scale: 2,
        useCORS: true,
        backgroundColor: bgColor
    }).then(canvas=>{
        document.getElementById("resultImg").src = canvas.toDataURL('image/png');
        document.getElementById("imageModal").classList.add("show");
    }).catch(err=>{
        alert("生成图片失败，请重试");
        console.error(err);
    });
}
// 语音识别入口
function startVoiceRecognition(){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition){
        alert("当前浏览器不支持语音识别\n苹果手机请用Safari打开\n并部署到HTTPS线上网址");
        return;
    }
    if(recognition) recognition.abort();
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';
    recognition.continuous = false;
    recognition.interimResults = false;
    document.getElementById("btnVoiceInput").innerText = "🎤识别中…";
    recognition.onresult = function(e){
        const transcript = e.results[0][0].transcript;
        parseVoiceText(transcript);
        document.getElementById("btnVoiceInput").innerText = "🎤语音";
    };
    recognition.onerror = function(err){
        console.log(err);
        document.getElementById("btnVoiceInput").innerText = "🎤语音";
        alert("语音识别出错：" + err.error);
    };
    recognition.onspeechend = function(){
        recognition.stop();
        document.getElementById("btnVoiceInput").innerText = "🎤语音";
    };
    recognition.start();
}
// 语音文本解析：依次填充 主单里程、运费、放空里程
function parseVoiceText(text){
    const numList = text.match(/\d+(\.\d+)?/g);
    if(!numList || numList.length === 0) return;
    const arr = numList.map(x=>Number(x));
    if(arr[0]) document.getElementById('mainKm').value = arr[0];
    if(arr[1]) document.getElementById('mainMoney').value = arr[1];
    if(arr[2]) document.getElementById('emptyKm').value = arr[2];
    updateEmptyMileText();
    saveCache();
}
// 页面加载绑定所有事件
document.addEventListener('DOMContentLoaded', function(){
    loadCache();
    // 主题切换
    document.getElementById('btnTheme').onclick = toggleTheme;
    // 历史/计算页切换
    document.getElementById('btnGoHis').onclick = switchPage;
    document.getElementById('btnGoCalc').onclick = switchPage;
    // 计算按钮
    document.getElementById('btnCalc').onclick = calculate;
    // 语音按钮
    document.getElementById('btnVoiceInput').onclick = startVoiceRecognition;
    // 油价、高速单价加减按钮
    document.querySelectorAll('.adj-btn').forEach(btn=>{
        btn.onclick = function(){
            adjustValue(this.dataset.adj, this.dataset.step);
        };
    });
    // 放空面板折叠
    document.getElementById('emptyToggle').onclick = function(){
        document.getElementById('emptyCard').classList.toggle('open');
    };
    document.getElementById('emptyKm').addEventListener('input', function(){
        updateEmptyMileText();
        saveCache();
    });
    // 拼单整体展开收起
    document.getElementById('btnTogglePin').onclick = function(){
        document.getElementById('pinBox').classList.toggle('show');
        this.innerText = document.getElementById('pinBox').classList.contains('show') ? '收起多拼单录入' : '展开多拼单录入';
    };
    // 单个拼单折叠
    document.querySelectorAll('.pin-head').forEach(h=>{
        h.onclick = function(e){
            if(e.target.classList.contains('pin-clear')) return;
            const n = this.dataset.pin;
            const body = document.querySelector(`[data-body="${n}"]`);
            body.classList.toggle('show');
            const icon = this.querySelector('.icon');
            icon.innerText = body.classList.contains('show') ? '−' : '+';
        };
    });
    // 单拼单清空
    document.querySelectorAll('.pin-clear').forEach(btn=>{
        btn.onclick = function(e){
            e.stopPropagation();
            const n = this.dataset.clear;
            document.getElementById(`p${n}km`).value = '';
            document.getElementById(`p${n}high`).value = '';
            document.getElementById(`p${n}money`).value = '';
            saveCache();
        };
    });
    // 明细展开/收起
    document.getElementById('btnDetail').onclick = function(){
        document.getElementById('detailBox').classList.toggle('open');
        this.innerText = document.getElementById('detailBox').classList.contains('open') ? '收起明细' : '展开明细';
    };
    // 生成图片弹窗
    document.getElementById('btnImage').onclick = generateImage;
    document.getElementById('closeImage').onclick = function(){
        document.getElementById("imageModal").classList.remove("show");
    };
    // 清空主单信息（保留油价、油耗、高速单价）
    document.getElementById('btnClearMain').onclick = function(){
        document.getElementById('mainKm').value = '';
        document.getElementById('mainMoney').value = '';
        document.getElementById('infoFee').value = '';
        document.getElementById('emptyKm').value = '';
        document.getElementById('emptyHigh').value = '';
        updateEmptyMileText();
        saveCache();
    };
    // 清空全部拼单
    document.getElementById('btnClearPin').onclick = function(){
        ['p1km','p1high','p1money','p2km','p2high','p2money','p3km','p3high','p3money'].forEach(id=>{
            document.getElementById(id).value = '';
        });
        saveCache();
    };
    // 全局重置按钮
    document.getElementById('btnResetAll').onclick = function(){
        safeRemove("truck_calc_history");
        document.getElementById("mainKm").value = '';
        document.getElementById("mainMoney").value = '';
        document.getElementById("infoFee").value = '';
        document.getElementById("emptyKm").value = '';
        document.getElementById("emptyHigh").value = '';
        document.getElementById("p1km").value = '';
        document.getElementById("p1high").value = '';
